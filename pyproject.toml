[project]
name = "ntp-timestamp"
version = "0.1.0"
description = "Encode and decode NTP 64-bit timestamps to Python datetime objects and Unix floats"
requires-python = ">=3.10"
dependencies = []
readme = "README.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
